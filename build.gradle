// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    // https://developer.android.com/build/kotlin-support
    // https://developer.android.com/build/releases/gradle-plugin
    // https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-gradle-plugin
    // https://mvnrepository.com/artifact/com.android.tools/r8?repo=google
    // AGP 8.13 + Gradle 8.13 + Kotlin 2.1: Media3 1.9 требует compileSdk 35, его не
    // собрать на AGP 7.4. Свой R8 4.x (ради API 19) больше не нужен — minSdk 23.
    ext.kp_version = '2.1.21'
    ext.gp_version = '8.13.2'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kp_version"
    }
}

plugins {
    id 'com.google.devtools.ksp' version "${kp_version}-2.0.2" apply false
    id 'org.jetbrains.kotlin.android' version "${kp_version}" apply false
}
ext {
    activityKtxVersion = '1.8.0'
    activityKtxVersion1 = '1.8.2'
    activityKtxVersion2 = activityKtxVersion1
    activityKtxVersion3 = activityKtxVersion
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
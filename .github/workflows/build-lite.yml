name: Build lite APK

# Вручную — кнопкой Run workflow; по тегу v* — ещё и в релиз, откуда APK
# забирает автообновление приложения (helpers/Updater.kt). Тег test-* — тестовая
# сборка: уходит в пререлиз, который Updater не предлагает, а GitHub не считает
# последним релизом (ссылки releases/latest на него не ведут).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'test-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionName берётся из git describe --tags, versionCode — из числа
          # коммитов origin/main, поэтому нужна полная история и теги
          fetch-depth: 0

      - name: Ensure origin/main ref
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — подписать релиз нечем"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/keystore.jks" >> "$GITHUB_ENV"

      - name: Build lite release
        # chmod — страховка: gradlew коммитили с Windows, где флага
        # «исполняемый» нет, и шаг падал с «./gradlew: Permission denied»
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleLiteRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
          RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

      # Отдельный APK на архитектуру (splits в app/build.gradle): libVLC весит ~20 МБ
      # на каждую. x86 собирается только для эмулятора и в релиз не идёт.
      - name: Name the APKs by version and ABI
        id: apk
        run: |
          dir=app/build/outputs/apk/lite/release
          # Версию берём из метаданных самой сборки — это ровно то, что попало
          # в APK. Прежний вариант с git describe на репозитории без тегов давал
          # пустую строку (|| echo не срабатывал: код возврата брался у sed),
          # и файл назывался «TorrStream-.apk»
          ver=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['elements'][0]['versionName'])" "$dir/output-metadata.json" 2>/dev/null || true)
          if [ -z "$ver" ]; then ver=$(git describe --tags --dirty 2>/dev/null | sed 's/^v//'); fi
          if [ -z "$ver" ]; then ver=1.0.1; fi
          for abi in arm64-v8a armeabi-v7a; do
            src="$dir/app-lite-$abi-release.apk"
            if [ ! -f "$src" ]; then echo "::error::Не собрался APK $abi"; ls -la "$dir"; exit 1; fi
            cp "$src" "TorrStream-$ver-$abi.apk"
          done
          echo "arm64=TorrStream-$ver-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "armv7=TorrStream-$ver-armeabi-v7a.apk" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify signatures
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          for f in "${{ steps.apk.outputs.arm64 }}" "${{ steps.apk.outputs.armv7 }}"; do
            "$apksigner" verify --print-certs "$f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrStream-lite-${{ steps.apk.outputs.version }}
          path: |
            ${{ steps.apk.outputs.arm64 }}
            ${{ steps.apk.outputs.armv7 }}
          # Квота хранилища Actions невелика: APK скачивают сразу после сборки,
          # а для долгого хранения есть релизы
          retention-days: 7

      # Описание релиза — текст аннотированного тега. Релиз без описания GitHub
      # отдаёт с "body": null, а приложение до 1.0.8 на этом падало в цикле
      # (Updater.getOverview). Пустым описание не оставляем ни при каком теге.
      - name: Release notes from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # checkout может подменить аннотированный тег лёгким — забираем оригинал
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # Весь текст тега, а не только %(contents:body): body — это то, что после
          # первой пустой строки, и сообщение без неё (v1.0.9) целиком уходило в
          # subject, а релиз получал заглушку. Подпись подписанного тега отрезаем.
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" \
            | sed '/-----BEGIN PGP SIGNATURE-----/,$d' \
            | sed '/^[[:space:]]*$/d' > release-notes.md
          if [ ! -s release-notes.md ]; then echo "TorrStream ${GITHUB_REF_NAME#v}" > release-notes.md; fi
          cat release-notes.md

      # Два шага, а не один files: порядок вложений важен. Приложение до 1.1
      # (Updater без выбора по архитектуре) качает ПОСЛЕДНИЙ APK релиза, а
      # последним должен быть armeabi-v7a — он ставится на любое ARM-устройство.
      # Один шаг грузит файлы параллельно, и порядок не гарантирован.
      - name: Attach arm64 APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.arm64 }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref, 'refs/tags/test-') }}

      - name: Attach armeabi-v7a APK to release (last)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.armv7 }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref, 'refs/tags/test-') }}

name: Build lite APK

# Вручную — кнопкой Run workflow; по тегу v* — ещё и в релиз, откуда APK
# забирает автообновление приложения (helpers/Updater.kt).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionName берётся из git describe --tags, versionCode — из числа
          # коммитов origin/main, поэтому нужна полная история и теги
          fetch-depth: 0

      - name: Ensure origin/main ref
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — подписать релиз нечем"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing/keystore.jks" >> "$GITHUB_ENV"

      - name: Build lite release
        # chmod — страховка: gradlew коммитили с Windows, где флага
        # «исполняемый» нет, и шаг падал с «./gradlew: Permission denied»
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleLiteRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
          RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

      - name: Name the APK by version
        id: apk
        run: |
          src=$(find app/build/outputs/apk/lite/release -name '*.apk' | head -n1)
          if [ -z "$src" ]; then echo "::error::APK не собрался"; exit 1; fi
          # Версию берём из метаданных самой сборки — это ровно то, что попало
          # в APK. Прежний вариант с git describe на репозитории без тегов давал
          # пустую строку (|| echo не срабатывал: код возврата брался у sed),
          # и файл назывался «TorrStream-.apk»
          meta=app/build/outputs/apk/lite/release/output-metadata.json
          ver=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['elements'][0]['versionName'])" "$meta" 2>/dev/null || true)
          if [ -z "$ver" ]; then ver=$(git describe --tags --dirty 2>/dev/null | sed 's/^v//'); fi
          if [ -z "$ver" ]; then ver=1.0.1; fi
          out="TorrStream-$ver.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Verify signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          "$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrStream-lite-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          # Квота хранилища Actions невелика: APK скачивают сразу после сборки,
          # а для долгого хранения есть релизы
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}

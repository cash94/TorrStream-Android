// Модуль decoder_ffmpeg из исходников Media3 (Apache-2.0) с FFmpeg, собранным
// build_ffmpeg.sh. Параметры передаёт ../build.sh: -Pmedia3Version,
// -PmoduleDir (src/main модуля), -PndkVersion.
plugins {
    id 'com.android.library' version '8.13.2'
}

def moduleDir = file(property('moduleDir'))

android {
    namespace 'androidx.media3.decoder.ffmpeg'
    compileSdk 36
    ndkVersion property('ndkVersion')

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles "${moduleDir}/../../proguard-rules.txt"
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }

    sourceSets {
        main {
            manifest.srcFile "${moduleDir}/AndroidManifest.xml"
            java.srcDirs = ["${moduleDir}/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path "${moduleDir}/jni/CMakeLists.txt"
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def v = property('media3Version')
    compileOnly "androidx.media3:media3-decoder:$v"
    compileOnly "androidx.media3:media3-exoplayer:$v"
    compileOnly 'androidx.annotation:annotation:1.9.1'
    compileOnly 'org.checkerframework:checker-qual:3.49.0'
    compileOnly 'com.google.errorprone:error_prone_annotations:2.36.0'
}
